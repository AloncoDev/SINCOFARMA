# Checagens de todo push e pull request. A main publica direto na Vercel,
# então nada deve entrar nela sem estes dois jobs verdes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Front (lint, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # instalação limpa, como a da Vercel: pega conflitos de dependência antes do deploy
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta (demo nos 3 perfis, CSP de produção)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # em caso de falha: rastro de cada teste (abrir com npx playwright show-trace)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-rastros
          path: test-results/
          retention-days: 7

  backend:
    name: Backend (testes, cfn-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # falhas de segurança conhecidas nas dependências do Python
      - run: pip-audit -r requirements-dev.txt -r src/requirements.txt
      - run: cfn-lint --regions sa-east-1 -- template.yaml
      - run: cfn-lint --regions us-east-1 -- orcamento.yaml
